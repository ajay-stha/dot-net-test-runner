name: Release

on:
  push:
    branches:
      - main
    tags:
      - v*
  workflow_dispatch:
    inputs:
      architecture:
        description: Windows architecture to publish
        required: true
        default: x64
        type: choice
        options:
          - x64
          - x86
          - arm64

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check application version
    runs-on: windows-latest
    outputs:
      number: ${{ steps.version.outputs.number }}
      changed: ${{ steps.version.outputs.changed }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check version
        id: version
        shell: pwsh
        run: |
          $isTag = "${{ github.ref_type }}" -eq "tag"

          if ($isTag) {
              $tag = "${{ github.ref_name }}"
              $versionMatch = [regex]::Match($tag, "^v(?<version>\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?)$")

              if (-not $versionMatch.Success) {
                  throw "Tag '$tag' must use the format v<semantic-version>, for example v1.2.3."
              }

              $currentVersion = $versionMatch.Groups["version"].Value
              $changed = $true
          }
          else {
              [xml] $currentProject = Get-Content DotNetTestRunner.csproj
              $currentVersion = [string] $currentProject.Project.PropertyGroup.Version

              if ([string]::IsNullOrWhiteSpace($currentVersion)) {
                  throw "DotNetTestRunner.csproj does not define a Version."
              }

              $changed = "${{ github.event_name }}" -eq "workflow_dispatch"
          }

          if (-not $changed -and -not $isTag) {
              $previousRevision = "${{ github.event.before }}"

              if ($previousRevision -eq "0000000000000000000000000000000000000000") {
                  $changed = $true
              }
              else {
                  $previousContent = git show "${previousRevision}:DotNetTestRunner.csproj"

                  if ($LASTEXITCODE -ne 0) {
                      throw "Unable to read DotNetTestRunner.csproj from revision $previousRevision."
                  }

                  $previousText = [string]::Join([Environment]::NewLine, $previousContent)
                  $previousMatch = [regex]::Match($previousText, "<Version>([^<]+)</Version>")
                  $previousVersion = $previousMatch.Groups[1].Value
                  $changed = $currentVersion -ne $previousVersion
              }
          }

          "number=$currentVersion" >> $env:GITHUB_OUTPUT
          "changed=$($changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

  publish:
    name: Publish v${{ needs.version.outputs.number }}
    needs: version
    if: needs.version.outputs.changed == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ARCHITECTURE: ${{ inputs.architecture || 'x64' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Publish application
        run: >
          dotnet publish DotNetTestRunner.csproj
          --configuration Release
          --runtime win-${{ env.ARCHITECTURE }}
          --self-contained true
          --output publish
          -p:Version=${{ needs.version.outputs.number }}
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:PublishTrimmed=false

      - name: Create release archive
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release
          Compress-Archive -Path publish\* -DestinationPath release\DotNetTestRunner-v${{ needs.version.outputs.number }}-win-${{ env.ARCHITECTURE }}.zip

      - name: Upload release archive
        uses: actions/upload-artifact@v6
        with:
          name: DotNetTestRunner-v${{ needs.version.outputs.number }}-win-${{ env.ARCHITECTURE }}
          path: release\DotNetTestRunner-v${{ needs.version.outputs.number }}-win-${{ env.ARCHITECTURE }}.zip
          if-no-files-found: error
          retention-days: 30

      - name: Prepare release notes
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = [regex]::Escape("${{ needs.version.outputs.number }}")
          $changelog = [System.IO.File]::ReadAllText("CHANGELOG.md")
          $pattern = "(?ms)^## \[$version\](?: - [^\r\n]+)?\r?\n(?<notes>.*?)(?=^## |\z)"
          $match = [regex]::Match($changelog, $pattern)

          if (-not $match.Success) {
              throw "CHANGELOG.md does not contain a '## [${{ needs.version.outputs.number }}]' section."
          }

          $notes = $match.Groups["notes"].Value.Trim()

          if ([string]::IsNullOrWhiteSpace($notes)) {
              throw "The changelog section for version ${{ needs.version.outputs.number }} is empty."
          }

          [System.IO.File]::WriteAllText(
              "release\release-notes.md",
              $notes,
              [System.Text.UTF8Encoding]::new($false)
          )

      - name: Create GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ needs.version.outputs.number }}"
          $tag = "v$version"
          $archive = "release\DotNetTestRunner-v$version-win-${{ env.ARCHITECTURE }}.zip"
          $notes = "release\release-notes.md"
          $isPrerelease = $version.Contains("-")

          gh release view $tag --repo "${{ github.repository }}" *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
              gh release upload $tag $archive `
                  --repo "${{ github.repository }}" `
                  --clobber

              if ($LASTEXITCODE -eq 0) {
                  gh release edit $tag `
                      --repo "${{ github.repository }}" `
                      --notes-file $notes
              }
          }
          else {
              $arguments = @(
                  "release", "create", $tag, $archive,
                  "--repo", "${{ github.repository }}",
                  "--target", "${{ github.sha }}",
                  "--title", ".NET Test Runner $tag",
                  "--notes-file", $notes
              )

              if ($isPrerelease) {
                  $arguments += "--prerelease"
              }

              & gh @arguments
          }

          if ($LASTEXITCODE -ne 0) {
              throw "Failed to create or update GitHub release $tag."
          }
